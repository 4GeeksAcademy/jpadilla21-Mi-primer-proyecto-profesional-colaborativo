<!DOCTYPE html>
<html lang="fr" id="html-tag">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L'Élégance Parisienne | Votre Panier</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@200..800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-serif { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="bg-stone-50 text-stone-900 flex flex-col min-h-screen">

  <!-- NAVBAR REUTILIZABLE -->
  <header class="sticky top-0 z-50 bg-white border-b border-stone-200 shadow-sm">
    <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
      <div class="flex-shrink-0"><a href="index.html" class="font-serif text-2xl font-bold tracking-widest uppercase">L'ÉLÉGANCE</a></div>
      <div class="flex items-center gap-6">
        <div class="relative inline-block text-left group">
          <button type="button" class="bg-white border border-stone-200 px-2.5 py-1.5 text-xs font-medium rounded-md"><span id="current-lang-label">🌐 FR</span></button>
          <div class="origin-top-right absolute right-0 mt-1 w-28 rounded-md shadow-lg bg-white opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50">
            <div class="py-1">
              <button onclick="changeLanguage('fr')" class="w-full text-left px-4 py-2 text-xs hover:bg-stone-50 cursor-pointer">Français</button>
              <button onclick="changeLanguage('es')" class="w-full text-left px-4 py-2 text-xs hover:bg-stone-50 cursor-pointer">Español</button>
            </div>
          </div>
        </div>
        <a href="catalogo.html" data-translate="nav_catalogue" class="text-stone-600 text-xs font-medium uppercase">Catalogue</a>
        <a href="carrito.html" data-translate="nav_cart" class="text-stone-900 border-b-2 border-stone-900 text-xs font-medium uppercase pb-1">Panier</a>
      </div>
    </nav>
  </header>

  <!-- CONTENIDO VISTA COMPLETA -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <h1 data-translate="cart_title" class="font-serif text-3xl font-bold mb-8 text-stone-900">Votre Panier</h1>

    <!-- CUADRO COMPRA ACTIVA -->
    <div id="cart-content" class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start hidden">
      <!-- Izquierda: Listado completo -->
      <div class="lg:col-span-2 space-y-4" id="cart-items-container"></div>

      <!-- Derecha: Cuadro Totalización -->
      <div class="bg-white border border-stone-200 p-6 rounded-lg">
        <h2 data-translate="summary_title" class="font-serif text-base font-bold mb-4">Résumé de la commande</h2>
        <div class="space-y-3 pb-4 border-b border-stone-100 text-xs text-stone-500">
          <div class="flex justify-between">
            <span data-translate="summary_subtotal">Sous-total</span>
            <span id="summary-subtotal" class="text-stone-900 font-medium">0,00 €</span>
          </div>
          <div class="flex justify-between">
            <span data-translate="summary_tax">Taxes (20%)</span>
            <span id="summary-tax" class="text-stone-900 font-medium">0,00 €</span>
          </div>
        </div>
        <div class="flex justify-between items-baseline pt-4 mb-6">
          <span data-translate="summary_total" class="font-bold text-xs">Total</span>
          <span id="summary-total" class="text-base font-bold text-stone-950 font-sans">0,00 €</span>
        </div>
        <a href="checkout.html" data-translate="btn_checkout" class="block text-center w-full bg-stone-900 hover:bg-stone-800 text-white font-medium py-3 text-xs uppercase tracking-widest rounded-md font-semibold">Acheter</a>
      </div>
    </div>
  </main>

  <!-- FOOTER REUTILIZABLE -->
  <footer class="bg-stone-950 text-stone-400 text-xs pt-12 pb-6 border-t border-stone-800">
    <div class="max-w-7xl mx-auto px-4 grid grid-cols-1 md:grid-cols-4 gap-8 mb-8">
      <div><h4 class="text-white font-serif text-sm font-bold tracking-widest uppercase mb-3">L'ÉLÉGANCE</h4></div>
      <div><h4 class="text-white font-semibold mb-3 uppercase" data-translate="footer_cat_title">Catégories</h4></div>
      <div><h4 class="text-white font-semibold mb-3 uppercase">Contacto</h4><p class="text-stone-500">support@lelegance.com</p></div>
    </div>
  </footer>

  <script>
    // Repoblación dinámica idéntica
    const mockImages = [
      "https://images.unsplash.com/photo-1596755094514-f87e34085b2c?q=80&w=300",
      "https://images.unsplash.com/photo-1541099649105-f69ad21f3246?q=80&w=300",
      "https://images.unsplash.com/photo-1539185441755-769473a23570?q=80&w=300"
    ];

    const translations = {
      fr: { nav_catalogue: "Catalogue", nav_cart: "Panier", cart_title: "Votre Panier", summary_title: "Résumé", summary_subtotal: "Sous-total", summary_tax: "Taxes (20%)", summary_total: "Total", btn_checkout: "Acheter", btn_remove: "Supprimer", prod_1: "Chemise Lin Classique", prod_2: "Pantalon Chino Beige", prod_3: "Chaussures Oxford Cuir" },
      es: { nav_catalogue: "Catálogo", nav_cart: "Carrito", cart_title: "Su Carrito", summary_title: "Resumen del pedido", summary_subtotal: "Subtotal", summary_tax: "Impuestos (20%)", summary_total: "Total", btn_checkout: "COMPRAR", btn_remove: "Eliminar", prod_1: "Camisa de Lino Clásica", prod_2: "Pantalón Chino Beige", prod_3: "Zapatos Oxford de Cuero" }
    };

    // Inyección de 3 productos por defecto recomendados si localStorage está vacío
    function injectMockItemsIfEmpty() {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      if (cart.length === 0) {
        cart = [
          { key: "prod_1", price: 79.00, quantity: 1, size: "M" },
          { key: "prod_2", price: 95.00, quantity: 2, size: "L" },
          { key: "prod_3", price: 140.00, quantity: 1, size: "S" }
        ];
        localStorage.setItem('cart', JSON.stringify(cart));
      }
    }

    function renderCart() {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      const currentLang = localStorage.getItem('preferred-lang') || 'fr';
      const container = document.getElementById('cart-items-container');
      const contentSection = document.getElementById('cart-content');

      contentSection.classList.remove('hidden');
      container.innerHTML = '';
      let subtotal = 0;

      cart.forEach((item, index) => {
        const itemTotal = item.price * item.quantity;
        subtotal += itemTotal;
        const name = translations[currentLang][item.key] || `Produit N°${item.key.split('_')[1]}`;
        const imgIndex = parseInt(item.key.split('_')[1] - 1) % 3;
        const img = mockImages[imgIndex];

        container.innerHTML += `
          <div class="flex items-center justify-between bg-white border border-stone-200 p-4 rounded-lg shadow-xs gap-4">
            <div class="flex items-center gap-4">
              <img src="${img}" class="w-14 h-14 rounded-md object-cover flex-shrink-0 bg-stone-100">
              <div>
                <h3 class="text-xs font-semibold text-stone-900">${name}</h3>
                <p class="text-[10px] text-stone-400 mt-0.5">Taille: ${item.size} | PU: ${item.price.toFixed(2)} €</p>
                <p class="text-[10px] text-stone-600 mt-0.5">Qte: ${item.quantity}</p>
              </div>
            </div>
            <div class="text-right flex flex-col items-end gap-1">
              <span class="text-xs font-semibold text-stone-900">${itemTotal.toFixed(2)} €</span>
              <button onclick="removeItem(${index})" class="text-[10px] text-stone-400 hover:text-red-600 underline cursor-pointer">${translations[currentLang].btn_remove}</button>
            </div>
          </div>
        `;
      });

      const tax = subtotal * 0.20;
      document.getElementById('summary-subtotal').textContent = `${subtotal.toFixed(2)} €`;
      document.getElementById('summary-tax').textContent = `${tax.toFixed(2)} €`;
      document.getElementById('summary-total').textContent = `${(subtotal + tax).toFixed(2)} €`;
    }

    function removeItem(index) {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      cart.splice(index, 1);
      localStorage.setItem('cart', JSON.stringify(cart));
      renderCart();
    }

    function changeLanguage(lang) {
      document.querySelectorAll('[data-translate]').forEach(el => {
        const key = el.getAttribute('data-translate');
        if (translations[lang]?.[key]) el.textContent = translations[lang][key];
      });
      document.getElementById('current-lang-label').textContent = `🌐 ${lang.toUpperCase()}`;
      localStorage.setItem('preferred-lang', lang);
      renderCart();
    }

    window.addEventListener('DOMContentLoaded', () => {
      injectMockItemsIfEmpty();
      const lang = localStorage.getItem('preferred-lang') || 'fr';
      changeLanguage(lang);
    });
  </script>
</body>
</html>
