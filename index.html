<!DOCTYPE html>
<html lang="fr" id="html-tag">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L'Élégance Parisienne | Accueil</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght=0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght=200..800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-serif { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="bg-stone-50 text-stone-900 flex flex-col min-h-screen">

  <header class="sticky top-0 z-50 bg-white border-b border-stone-200 shadow-sm">
    <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
      <div class="flex-shrink-0">
        <a href="index.html" class="font-serif text-2xl font-bold tracking-widest uppercase">L'ÉLÉGANCE</a>
      </div>
      <div class="flex items-center gap-6">
        <div class="relative inline-block text-left group">
          <button type="button" class="inline-flex justify-center items-center gap-1 bg-white text-stone-600 hover:text-stone-900 border border-stone-200 px-2.5 py-1.5 text-xs font-medium rounded-md transition-colors">
            <span id="current-lang-label">🌐 FR</span>
          </button>
          <div class="origin-top-right absolute right-0 mt-1 w-28 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50">
            <div class="py-1">
              <button type="button" onclick="changeLanguage('fr')" class="w-full text-left text-stone-900 block px-4 py-2 text-xs hover:bg-stone-50 cursor-pointer">Français</button>
              <button type="button" onclick="changeLanguage('es')" class="w-full text-left text-stone-600 block px-4 py-2 text-xs hover:bg-stone-50 cursor-pointer">Español</button>
            </div>
          </div>
        </div>
        <a href="catalogo.html" data-translate="nav_catalogue" class="text-stone-600 hover:text-stone-900 text-xs font-medium uppercase tracking-wider">Catalogue</a>
        <a href="carrito.html" class="text-stone-600 hover:text-stone-900 transition-colors relative p-1">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" /></svg>
          <span id="cart-counter" class="absolute -top-1 -right-1 bg-amber-700 text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
        </a>
      </div>
    </nav>
  </header>

  <section class="relative bg-stone-900 h-[480px] flex items-center justify-center overflow-hidden">
    <img 
      src="https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=1920&q=80" 
      alt="Paris Haute Couture" 
      class="absolute inset-0 w-full h-full object-cover object-center transform scale-101"
    >
    <div class="absolute inset-0 bg-black/55 backdrop-blur-[1px]"></div>

    <div class="relative z-10 text-center px-4 max-w-3xl mx-auto flex flex-col items-center gap-4">
      <h1 class="font-serif text-white text-4xl sm:text-5xl md:text-6xl font-light tracking-[0.2em] uppercase leading-tight">
        Chic Parisien
      </h1>
      <p data-translate="hero_subtitle" class="text-stone-300 text-xs sm:text-sm font-medium tracking-[0.25em] uppercase mb-4">
        Nouvelle Collection Automne / Hiver 2026
      </p>
      <a 
        href="catalogo.html" 
        data-translate="btn_shop" 
        class="inline-block bg-white text-stone-950 font-semibold text-xs tracking-[0.2em] uppercase px-8 py-3.5 border border-white hover:bg-transparent hover:text-white transition-all duration-300"
      >
        Découvrir Le Catalogue
      </a>
    </div>
  </section>

  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-16">
    <div class="text-center mb-12">
      <h2 data-translate="featured_title" class="font-serif text-2xl sm:text-3xl font-normal tracking-wide mb-2">Produits Vedettes</h2>
      <div class="h-[1px] w-12 bg-stone-400 mx-auto"></div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6" id="index-products-container">
      </div>
  </main>

  <footer class="bg-stone-950 text-stone-400 text-xs py-6 text-center border-t border-stone-800">
    <div>&copy; 2026 L'Élégance Parisienne. All rights reserved.</div>
  </footer>

  <script>
    // BASE DE DATOS GLOBAL UNIFICADA CON IMÁGENES DE INTERNET ESTABLES
    const productsDB = [
      { id: "prod_2", price: 85.00, img: "https://images.unsplash.com/photo-1522312346375-d1a52e2b99b3?auto=format&fit=crop&w=600&q=80", fr: "Montre Minimaliste", es: "Reloj Minimalista de Lujo", cat: "Accessoires" },
      { id: "prod_3", price: 45.00, img: "https://images.unsplash.com/photo-1541099649105-f69ad21f3246?auto=format&fit=crop&w=600&q=80", fr: "Jean Bleu Classique", es: "Pantalón Denim Elegante", cat: "Pantalons" },
      { id: "prod_4", price: 52.50, img: "https://images.unsplash.com/photo-1549298916-b41d501d3772?auto=format&fit=crop&w=600&q=80", fr: "Baskets Élégantes", es: "Calzado Deportivo Casual", cat: "Chaussures" },
      { id: "prod_6", price: 110.00, img: "https://images.unsplash.com/photo-1591047139829-d91aecb6caea?auto=format&fit=crop&w=600&q=80", fr: "Blazer Casual Moderne", es: "Chaqueta Casual Elegante", cat: "Chemises" }
    ];

    const translations = {
      fr: { nav_catalogue: "Catalogue", hero_subtitle: "Nouvelle Collection Automne / Hiver 2026", btn_shop: "Découvrir Le Catalogue", featured_title: "Produits Vedettes" },
      es: { nav_catalogue: "Catálogo", hero_subtitle: "Nueva Colección Otoño / Invierno 2026", btn_shop: "Descubrir El Catálogo", featured_title: "Productos Destacados" }
    };

    function changeLanguage(lang) {
      document.querySelectorAll('[data-translate]').forEach(el => {
        const key = el.getAttribute('data-translate');
        if (translations[lang]?.[key]) el.textContent = translations[lang][key];
      });
      document.getElementById('current-lang-label').textContent = `🌐 ${lang.toUpperCase()}`;
      localStorage.setItem('preferred-lang', lang);
      renderIndexProducts();
    }

    function updateCartCounter() {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      document.getElementById('cart-counter').textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
    }

    function renderIndexProducts() {
      const lang = localStorage.getItem('preferred-lang') || 'fr';
      const container = document.getElementById('index-products-container');
      if(!container) return;
      container.innerHTML = '';

      productsDB.forEach(prod => {
        container.innerHTML += `
          <div class="bg-white border border-stone-200 p-4 rounded-lg shadow-xs flex flex-col justify-between">
            <a href="producto.html?id=${prod.id}">
              <div class="bg-stone-100 aspect-[3/4] overflow-hidden rounded-md mb-3">
                <img src="${prod.img}" alt="${prod[lang]}" class="w-full h-full object-cover hover:scale-105 transition-transform duration-300">
              </div>
              <h3 class="text-xs font-semibold text-stone-900 truncate">${prod[lang]}</h3>
              <p class="text-xs font-bold text-stone-950 mt-1">${prod.price.toFixed(2)} €</p>
            </a>
          </div>
        `;
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      const lang = localStorage.getItem('preferred-lang') || 'fr';
      changeLanguage(lang);
      updateCartCounter();
    });
  </script>
</body>
</html>
