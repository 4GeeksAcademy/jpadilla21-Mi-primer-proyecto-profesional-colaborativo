            <option value="S">S</option>

            <button onclick="stepQty(-1)" class="px-3 py-1.5 text-sm hover:bg-stone-100 font-bold">-</button>
            <input type="number" id="product-qty" value="1" min="1" class="w-12 text-center text-xs font-semibold focus:outline-none border-none bg-transparent">
            <button onclick="stepQty(1)" class="px-3 py-1.5 text-sm hover:bg-stone-100 font-bold">+</button>
          </div>
        </div>

        <button id="add-btn" class="w-full bg-stone-900 hover:bg-amber-700 text-white font-medium py-3.5 rounded-md text-xs uppercase tracking-widest transition-colors font-semibold cursor-pointer mb-8">Ajouter au panier</button>

    const translations = {
      fr: { nav_catalogue: "Catalogue", label_size: "Sélectionner la Taille", label_qty: "Quantité", btn_add: "Ajouter au panier", desc_title: "Détails et Matériaux", desc_materials_label: "Matériaux", desc_use_label: "Usage Recommandé", popup_success: "✓ Article ajouté!" },
      es: { nav_catalogue: "Catálogo", label_size: "Seleccionar Talla", label_qty: "Cantidad", btn_add: "Añadir al carrito", desc_title: "Detalles y Materiales", desc_materials_label: "Materiales", desc_use_label: "Uso Recomendado", popup_success: "✓ ¡Artículo añadido!" }
    };

    const params = new URLSearchParams(window.location.search);
    const currentId = params.get('id') || 'prod_1';

    function stepQty(amount) {
      const input = document.getElementById('product-qty');
      let val = parseInt(input.value) + amount;
      if (val < 1) val = 1;
      input.value = val;
    }

    function loadProduct() {
      const item = fullProductsCatalog.find(p => p.id === currentId) || fullProductsCatalog[0];
      const lang = localStorage.getItem('preferred-lang') || 'fr';
      
      document.getElementById('product-img').src = item.img;
      document.getElementById('product-img').alt = item[lang];
      document.getElementById('product-title').textContent = item[lang];
      document.getElementById('product-ref').textContent = item.ref;
      document.getElementById('product-price').textContent = `${item.price.toFixed(2).replace('.', ',')} €`;
      document.getElementById('desc-materials').textContent = lang === 'fr' ? item.matFr : item.matEs;
      document.getElementById('desc-use').textContent = lang === 'fr' ? item.useFr : item.useEs;
      
      const btn = document.getElementById('add-btn');
      btn.textContent = translations[lang].btn_add;
      btn.onclick = () => addToCart(item.id, item.price);
    }

    function changeLanguage(lang) {
      document.querySelectorAll('[data-translate]').forEach(el => {
        const key = el.getAttribute('data-translate');
        if (translations[lang]?.[key]) el.textContent = translations[lang][key];
      });
      document.getElementById('current-lang-label').textContent = `🌐 ${lang.toUpperCase()}`;
      localStorage.setItem('preferred-lang', lang);
      loadProduct();
    }

    function updateCartCounter() {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      document.getElementById('cart-counter').textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
    }

    function addToCart(productKey, price) {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      const qty = parseInt(document.getElementById('product-qty').value) || 1;
      const sizeSelected = document.getElementById('product-size').value;

      const existing = cart.find(item => item.key === productKey && item.size === sizeSelected);
      if (existing) { 
        existing.quantity += qty; 
      } else { 
        cart.push({ key: productKey, price: price, quantity: qty, size: sizeSelected }); 
      }
      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartCounter();
      const currentLang = localStorage.getItem('preferred-lang') || 'fr';
      const target = fullProductsCatalog.find(p => p.id === productKey);
      showPopup(target ? target[currentLang] : productKey);
    }

    function showPopup(name) {
      document.getElementById('popup-item-name').textContent = name;
      const p = document.getElementById('cart-popup');
      p.classList.remove('translate-y-20', 'opacity-0'); p.classList.add('translate-y-0', 'opacity-100');
      setTimeout(closePopup, 3000);
    }

    function closePopup() {
      const p = document.getElementById('cart-popup');
      if (p) { p.classList.remove('translate-y-0', 'opacity-100'); p.classList.add('translate-y-20', 'opacity-0'); }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const lang = localStorage.getItem('preferred-lang') || 'fr';
      changeLanguage(lang);
      updateCartCounter();
    });
  </script>
