<!DOCTYPE html>
<html lang="fr" id="html-tag">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L'Élégance Parisienne | Produit</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@200..800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-serif { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="bg-stone-50 text-stone-900 flex flex-col min-h-screen">

  <!-- NAVBAR -->
  <header class="sticky top-0 z-50 bg-white border-b border-stone-200 shadow-sm">
    <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
      <div class="flex-shrink-0">
        <a href="index.html" class="font-serif text-2xl font-bold tracking-widest uppercase">L'ÉLÉGANCE</a>
      </div>
      <div class="flex items-center gap-6">
        <div class="relative inline-block text-left group">
          <button type="button" class="inline-flex justify-center items-center gap-1 bg-white text-stone-600 hover:text-stone-900 border border-stone-200 px-2.5 py-1.5 text-xs font-medium rounded-md transition-colors">
            <span id="current-lang-label">🌐 FR</span>
          </button>
          <div class="origin-top-right absolute right-0 mt-1 w-28 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50">
            <div class="py-1">
              <button type="button" onclick="changeLanguage('fr')" class="w-full text-left text-stone-900 block px-4 py-2 text-xs hover:bg-stone-50 cursor-pointer">Français</button>
              <button type="button" onclick="changeLanguage('es')" class="w-full text-left text-stone-600 block px-4 py-2 text-xs hover:bg-stone-50 cursor-pointer">Español</button>
            </div>
          </div>
        </div>
        <a href="catalogo.html" data-translate="nav_catalogue" class="text-stone-600 hover:text-stone-900 text-xs font-medium uppercase tracking-wider">Catalogue</a>
        <a href="carrito.html" class="text-stone-600 hover:text-stone-900 transition-colors relative p-1">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" /></svg>
          <span id="cart-counter" class="absolute -top-1 -right-1 bg-amber-700 text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
        </a>
      </div>
    </nav>
  </header>

  <!-- DETALLE -->
  <main class="flex-grow max-w-5xl w-full mx-auto px-4 py-12 flex flex-col md:flex-row gap-12 items-center">
    <div class="w-full md:w-1/2 bg-white p-4 border border-stone-200 rounded-xl">
      <div class="aspect-[3/4] overflow-hidden rounded-lg bg-stone-100 flex items-center justify-center">
        <img id="product-img" src="" alt="" class="w-full h-full object-cover">
      </div>
    </div>

    <div class="w-full md:w-1/2 flex flex-col">
      <span id="product-ref" class="text-[10px] text-stone-400 font-bold tracking-widest uppercase mb-1">REF: </span>
      <h1 id="product-title" class="font-serif text-3xl font-medium tracking-wide text-stone-900 mb-2"></h1>
      <p id="product-price" class="text-xl font-bold text-stone-950 mb-6"></p>

      <div class="mb-4">
        <label data-translate="lbl_size" class="block text-[10px] uppercase font-bold tracking-wider text-stone-500 mb-2">Sélectionner Taille</label>
        <select id="product-size" class="w-full bg-white border border-stone-200 text-xs px-4 py-2.5 rounded-md focus:outline-none">
          <option value="S">S</option>
          <option value="M" selected>M</option>
          <option value="L">L</option>
          <option value="XL">XL</option>
        </select>
      </div>

      <div class="mb-6">
        <label data-translate="lbl_qty" class="block text-[10px] uppercase font-bold tracking-wider text-stone-500 mb-2">Quantité</label>
        <div class="flex items-center w-28 border border-stone-200 rounded-md bg-white">
          <button onclick="adjustQty(-1)" class="w-8 py-2 text-xs font-bold text-stone-600 hover:text-stone-900 cursor-pointer">-</button>
          <span id="product-qty" class="flex-1 text-center text-xs font-semibold">1</span>
          <button onclick="adjustQty(1)" class="w-8 py-2 text-xs font-bold text-stone-600 hover:text-stone-900 cursor-pointer">+</button>
        </div>
      </div>

      <button onclick="handleAddToCart()" data-translate="btn_add" class="w-full bg-stone-900 text-white text-xs py-3 uppercase tracking-widest font-medium rounded-md hover:bg-amber-700 transition-colors cursor-pointer">Ajouter au panier</button>
    </div>
  </main>

  <!-- POPUP NOTIFICACIÓN -->
  <div id="cart-popup" class="fixed bottom-5 right-5 bg-stone-900 text-white px-6 py-4 shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex flex-col gap-1 min-w-[280px] rounded-md">
    <p data-translate="popup_success" class="font-bold text-xs text-emerald-400">✓ Article ajouté!</p>
    <p id="popup-item-name" class="text-xs text-stone-300 font-medium"></p>
  </div>

  <footer class="bg-stone-950 text-stone-400 text-xs py-6 text-center border-t border-stone-800">
    <div>&copy; 2026 L'Élégance Parisienne. All rights reserved.</div>
  </footer>

  <script>
    // MISMA BASE DE DATOS EXACTA
    const productsDB = [
      { id: "prod_2", price: 85.00, img: "https://images.unsplash.com/photo-1522312346375-d1a52e2b99b3?auto=format&fit=crop&w=600&q=80", fr: "Montre Minimaliste", es: "Reloj Minimalista de Lujo", cat: "Accessoires" },
      { id: "prod_3", price: 45.00, img: "https://images.unsplash.com/photo-1541099649105-f69ad21f3246?auto=format&fit=crop&w=600&q=80", fr: "Jean Bleu Classique", es: "Pantalón Denim Elegante", cat: "Pantalons" },
      { id: "prod_4", price: 52.50, img: "https://images.unsplash.com/photo-1549298916-b41d501d3772?auto=format&fit=crop&w=600&q=80", fr: "Baskets Élégantes", es: "Calzado Deportivo Casual", cat: "Chaussures" },
      { id: "prod_6", price: 110.00, img: "https://images.unsplash.com/photo-1591047139829-d91aecb6caea?auto=format&fit=crop&w=600&q=80", fr: "Blazer Casual Moderne", es: "Chaqueta Casual Elegante", cat: "Chemises" }
    ];

    const translations = {
      fr: { nav_catalogue: "Catalogue", lbl_size: "Sélectionner Taille", lbl_qty: "Quantité", btn_add: "Ajouter au panier", popup_success: "✓ Article ajouté!" },
      es: { nav_catalogue: "Catálogo", lbl_size: "Seleccionar Talla", lbl_qty: "Cantidad", btn_add: "Añadir al carrito", popup_success: "✓ ¡Artículo añadido!" }
    };

    let currentQty = 1;
    let currentProduct = null;

    function changeLanguage(lang) {
      document.querySelectorAll('[data-translate]').forEach(el => {
        const key = el.getAttribute('data-translate');
        if (translations[lang]?.[key]) el.textContent = translations[lang][key];
      });
      document.getElementById('current-lang-label').textContent = `🌐 ${lang.toUpperCase()}`;
      localStorage.setItem('preferred-lang', lang);
      renderProduct();
    }

    function updateCartCounter() {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      document.getElementById('cart-counter').textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
    }

    function renderProduct() {
      const lang = localStorage.getItem('preferred-lang') || 'fr';
      const urlParams = new URLSearchParams(window.location.search);
      const prodId = urlParams.get('id');
      
      currentProduct = productsDB.find(p => p.id === prodId) || productsDB[0];

      document.getElementById('product-ref').textContent = `REF: ${currentProduct.id.toUpperCase()}`;
      document.getElementById('product-title').textContent = currentProduct[lang];
      document.getElementById('product-price').textContent = `${currentProduct.price.toFixed(2)} €`;
      document.getElementById('product-img').src = currentProduct.img;
      document.getElementById('product-img').alt = currentProduct[lang];
    }

    function adjustQty(amount) {
      currentQty += amount;
      if (currentQty < 1) currentQty = 1;
      document.getElementById('product-qty').textContent = currentQty;
    }

    function handleAddToCart() {
      if (!currentProduct) return;
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      const selectedSize = document.getElementById('product-size').value;
      
      const existing = cart.find(item => item.key === currentProduct.id && item.size === selectedSize);
      if (existing) { existing.quantity += currentQty; } else { cart.push({ key: currentProduct.id, price: currentProduct.price, quantity: currentQty, size: selectedSize }); }
      
      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartCounter();
      
      const lang = localStorage.getItem('preferred-lang') || 'fr';
      showPopup(currentProduct[lang]);
    }

    function showPopup(name) {
      document.getElementById('popup-item-name').textContent = name;
      const p = document.getElementById('cart-popup');
      p.classList.remove('translate-y-20', 'opacity-0');
      p.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => { p.classList.remove('translate-y-0', 'opacity-100'); p.classList.add('translate-y-20', 'opacity-0'); }, 3000);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const lang = localStorage.getItem('preferred-lang') || 'fr';
      changeLanguage(lang);
      updateCartCounter();
    });
  </script>
</body>
</html>
